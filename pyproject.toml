[project]
name = "cppap-recherche"
version = "1.0.0"
description = "Moteur de recherche des médias agréés CPPAP, enrichi par la base SIRENE"
requires-python = ">=3.11"
# Aucune dépendance de production : les scripts n'utilisent que la bibliothèque standard.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  # Les messages d'erreur destinés aux mainteneurs sont volontairement longs et littéraux.
  "EM101",
  "EM102",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
