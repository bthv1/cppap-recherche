name: Déploiement du relais SIRENE

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Déployer le Worker Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier les tests du relais
        run: node --test worker/index.test.mjs

      - name: Vérifier la présence du jeton Cloudflare
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo 'has_token=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_token=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Secret CLOUDFLARE_API_TOKEN absent — déploiement ignoré. Le relais est facultatif : le site fonctionne sans lui, sur l instantané SIRENE archivé.'
          fi

      - name: Déployer
        if: steps.check.outputs.has_token == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Rappeler la configuration côté site
        if: steps.check.outputs.has_token == 'true'
        run: |
          echo '::notice::Renseignez l URL du Worker dans la variable de dépôt SIRENE_PROXY_URL pour que le site propose le rafraîchissement SIRENE.'
