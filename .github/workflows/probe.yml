name: Sonde API SIRENE

on:
  workflow_dispatch:
    inputs:
      sirens:
        description: SIREN à tester, séparés par des espaces
        type: string
        default: '014851950 024061970 027120096 054394986'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Interroger l'API sous les deux formes
        env:
          SIRENS: ${{ inputs.sirens }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086  # séparation en mots voulue
          python scripts/match_sirene.py --probe $SIRENS
      - name: Réponse brute, pour lever tout doute sur les paramètres
        env:
          SIRENS: ${{ inputs.sirens }}
        run: |
          SIREN=$(printf '%s' "$SIRENS" | cut -d' ' -f1)
          UA='cppap-recherche/1.0 (+https://github.com/bthv1/cppap-recherche)'
          for Q in "$SIREN" "siren:$SIREN"; do
            echo "=== q=$Q (sans minimal/include) ==="
            curl -sS -A "$UA" --get \
              --data-urlencode "q=$Q" --data-urlencode 'per_page=1' \
              'https://recherche-entreprises.api.gouv.fr/search' \
              | head -c 400; echo
            echo "=== q=$Q (avec minimal + include) ==="
            curl -sS -A "$UA" --get \
              --data-urlencode "q=$Q" --data-urlencode 'per_page=1' \
              --data-urlencode 'minimal=true' \
              --data-urlencode 'include=siege,dirigeants,complements,finances,tva' \
              'https://recherche-entreprises.api.gouv.fr/search' \
              | head -c 400; echo
          done
