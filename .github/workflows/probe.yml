# Diagnostic à lancer quand le rattachement SIREN cesse de fonctionner : l'API a déjà
# changé de contrat une fois (`q=siren:…` a cessé de répondre), et le réseau nécessaire
# n'est pas toujours accessible depuis un poste de développement.
name: Sonde API SIRENE

on:
  workflow_dispatch:
    inputs:
      sirens:
        description: SIREN à tester, séparés par des espaces
        type: string
        default: '014851950 024061970 027120096 054394986'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Interroger l'API sous les deux formes
        env:
          SIRENS: ${{ inputs.sirens }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086  # séparation en mots voulue
          python scripts/match_sirene.py --probe $SIRENS
